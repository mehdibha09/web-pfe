server:
    port: 6060

spring:
    application:
        name: gateway

    cloud:
        gateway:
            default-filters:
                - CorrelationId
            routes:
                - id: auth-login
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/auth/login
                  filters:
                      - name: RateLimit
                        args:
                            maxRequests: 20
                            windowMs: 60000

                - id: auth-forgot-password
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/auth/forgot-password,/api/v1/auth/reset-password
                  filters:
                      - name: RateLimit
                        args:
                            maxRequests: 5
                            windowMs: 60000

                - id: auth-public
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/auth/refresh,/api/v1/auth/sso/**

                - id: auth-service
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/auth/**
                  filters:
                      - Auth

                - id: auth-users
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/users/**
                  filters:
                      - Auth

                - id: auth-roles
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/roles/**
                  filters:
                      - Auth

                - id: auth-permissions
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/permissions/**
                  filters:
                      - Auth

                - id: auth-tenants
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/tenants/**
                  filters:
                      - Auth

                - id: auth-sessions
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/sessions/**
                  filters:
                      - Auth

                - id: auth-audit
                  uri: http://localhost:7070
                  predicates:
                      - Path=/api/v1/audit-logs/**
                  filters:
                      - Auth
                      - name: RateLimit
                        args:
                            maxRequests: 30
                            windowMs: 60000

                - id: services
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/services/**
                  filters:
                      - Auth

                - id: environments
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/environments/**
                  filters:
                      - Auth

                - id: service-environments
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/service-environments/**
                  filters:
                      - Auth

                - id: deployments
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/deployments/**
                  filters:
                      - Auth

                - id: metrics
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/metrics/**
                  filters:
                      - Auth
                      - name: RateLimit
                        args:
                            maxRequests: 60
                            windowMs: 60000

                - id: vm
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/vms/**
                  filters:
                      - Auth

                - id: backups
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/backups/**
                  filters:
                      - Auth

                - id: ssh
                  uri: http://localhost:8082
                  predicates:
                      - Path=/ws/ssh/**
                  filters:
                      - Auth

                - id: k8s
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/k8s/**
                  filters:
                      - Auth

                - id: deployment-templates
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/deployment-templates/**
                  filters:
                      - Auth

                - id: costs
                  uri: http://localhost:8090
                  predicates:
                      - Path=/api/v1/costs/**
                  filters:
                      - Auth

                - id: quotas
                  uri: http://localhost:8090
                  predicates:
                      - Path=/api/v1/quotas/**
                  filters:
                      - Auth

                - id: pricing
                  uri: http://localhost:8090
                  predicates:
                      - Path=/api/v1/pricing/**
                  filters:
                      - Auth

                - id: alerts-pricer
                  uri: http://localhost:8090
                  predicates:
                      - Path=/api/v1/alerts/**
                  filters:
                      - Auth

                - id: notifications
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/notifications/**
                  filters:
                      - Auth

                - id: test
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/test/**

            httpclient:
                response-timeout: 300s
                connect-timeout: 5000

            globalcors:
                corsConfigurations:
                    '[/**]':
                        allowedOriginPatterns:
                            - 'http://localhost:*'
                            - 'http://127.0.0.1:*'
                        allowedMethods:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            - OPTIONS
                        allowedHeaders: '*'
                        exposedHeaders:
                            - Authorization
                            - Content-Disposition
                        allowCredentials: true
