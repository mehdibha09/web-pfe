server:
    port: 6060

auth-service-url: http://localhost:7070
deployment-service-url: http://localhost:8082
cloud-pricer-service-url: http://localhost:8090

spring:
    application:
        name: gateway

    cloud:
        gateway:
            default-filters:
                - CorrelationId
            routes:
                - id: auth-login
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/auth/login
                  filters:
                      - name: RateLimit
                        args:
                            maxRequests: 20
                            windowMs: 60000

                - id: auth-forgot-password
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/auth/forgot-password,/api/v1/auth/reset-password
                  filters:
                      - name: RateLimit
                        args:
                            maxRequests: 5
                            windowMs: 60000

                - id: auth-public
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/auth/refresh,/api/v1/auth/sso/**

                - id: auth-service
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/auth/**
                  filters:
                      - Auth

                - id: auth-users
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/users/**
                  filters:
                      - Auth

                - id: auth-roles
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/roles/**
                  filters:
                      - Auth

                - id: auth-permissions
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/permissions/**
                  filters:
                      - Auth

                - id: auth-tenants
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/tenants/**
                  filters:
                      - Auth

                - id: auth-sessions
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/sessions/**
                  filters:
                      - Auth

                - id: auth-audit
                  uri: ${auth-service-url}
                  predicates:
                      - Path=/api/v1/audit-logs/**
                  filters:
                      - Auth
                      - name: RateLimit
                        args:
                            maxRequests: 30
                            windowMs: 60000

                - id: services
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/services/**
                  filters:
                      - Auth

                - id: environments
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/environments/**
                  filters:
                      - Auth

                - id: service-environments
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/service-environments/**
                  filters:
                      - Auth

                - id: deployments
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/deployments/**
                  filters:
                      - Auth

                - id: metrics
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/metrics/**
                  filters:
                      - Auth
                      - name: RateLimit
                        args:
                            maxRequests: 60
                            windowMs: 60000

                - id: vm
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/vms/**
                  filters:
                      - Auth

                - id: backups
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/backups/**
                  filters:
                      - Auth

                - id: ssh
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/ws/ssh/**
                  filters:
                      - Auth

                - id: k8s
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/k8s/**
                  filters:
                      - Auth

                - id: deployment-templates
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/deployment-templates/**
                  filters:
                      - Auth

                - id: costs
                  uri: ${cloud-pricer-service-url}
                  predicates:
                      - Path=/api/v1/costs/**
                  filters:
                      - Auth

                - id: quotas
                  uri: ${cloud-pricer-service-url}
                  predicates:
                      - Path=/api/v1/quotas/**
                  filters:
                      - Auth

                - id: pricing
                  uri: ${cloud-pricer-service-url}
                  predicates:
                      - Path=/api/v1/pricing/**
                  filters:
                      - Auth

                - id: alerts-pricer
                  uri: ${cloud-pricer-service-url}
                  predicates:
                      - Path=/api/v1/alerts/**
                  filters:
                      - Auth

                - id: notifications
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/notifications/**
                  filters:
                      - Auth

                - id: test
                  uri: ${deployment-service-url}
                  predicates:
                      - Path=/api/v1/test/**

            httpclient:
                response-timeout: 300s
                connect-timeout: 5000

            globalcors:
                corsConfigurations:
                    '[/**]':
                        allowedOriginPatterns:
                            - '*'
                        allowedMethods:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            - OPTIONS
                        allowedHeaders: '*'
                        exposedHeaders:
                            - Authorization
                            - Content-Disposition
                        allowCredentials: true
