spring.application.name=cloud_pricer
server.port=8090

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deployment_service}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────────
# Cloud-pricer shares the database with deployment-service, which already runs
# its own Flyway history (V1..V10). Use a dedicated history table so both
# services can manage their own migrations independently.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_cloud_pricer
spring.flyway.baseline-on-migrate=true

# ── Errors ────────────────────────────────────────────────────────────────────
server.error.include-stacktrace=never

# ── SpringDoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Alert dispatch ────────────────────────────────────────────────────────────
alert.check.interval=60000
alert.dispatch.enabled=true

# ── Email ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@cloud-pricer.local}
management.endpoints.web.exposure.include=health,info,prometheus
management.health.mail.enabled=false

# ── Cost auto-generation ──────────────────────────────────────────────────────
cost.auto-gen.interval=3600000
cost.auto-gen.enabled=true
