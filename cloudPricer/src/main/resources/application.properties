spring.application.name=cloud_pricer
server.port=8090

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deployment_service}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────────
# Cloud-pricer shares the database with deployment-service, which already runs
# its own Flyway history (V1..V10). Use a dedicated history table so both
# services can manage their own migrations independently.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_cloud_pricer
spring.flyway.baseline-on-migrate=true

# ── Errors ────────────────────────────────────────────────────────────────────
server.error.include-stacktrace=never

# ── SpringDoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Alert dispatch ────────────────────────────────────────────────────────────
alert.check.interval=60000
alert.dispatch.enabled=true
# Politique de notification email : délai minimal entre deux notifications d'une
# meme clé (service-env + metrique + severite) pour une alerte récurrente, en ms.
# Une alerte qui reapparait (resolue puis recreee) dans cette fenetre ne re-spamme pas.
alert.dispatch.cooldown-ms=3600000
# Sévérité minimale notifiée par email (INFO|WARNING|CRITICAL). Les alertes en
# dessous de ce seuil sont enregistrées mais pas envoyées par email.
alert.dispatch.min-severity=WARNING
# Durée pendant laquelle un quota doit rester dépassé (>= max) avant que
# l'auto-stop (si activé sur le quota) ne stoppe les VMs / scale-0 les K8s du SE.
alert.auto-stop.grace-ms=120000

# ── Email ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@cloud-pricer.local}
frontend.base-url=${FRONTEND_BASE_URL:http://192.168.56.10:30080}
management.endpoints.web.exposure.include=health,info,prometheus
management.health.mail.enabled=false

# ── Cost auto-generation ──────────────────────────────────────────────────────
cost.auto-gen.interval=3600000
cost.auto-gen.enabled=true
