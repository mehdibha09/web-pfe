# Profil de test : base H2 en memoire, aucun serveur PostgreSQL requis.
spring.datasource.url=jdbc:h2:mem:auth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Les migrations Flyway sont specifiques a PostgreSQL (gen_random_uuid, pgcrypto) :
# le schema est genere par Hibernate a partir des entites.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Pas de mail reel ni de service distant pendant les tests.
# Un host factice suffit a creer le bean JavaMailSender (aucun envoi pendant contextLoads).
spring.mail.host=localhost
spring.mail.port=2525
alert.dispatch.enabled=false
