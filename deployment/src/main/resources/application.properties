spring.application.name=service
server.port=8082

# ── Base de données ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deployment_service}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── VM Provider ───────────────────────────────────────────────────────────────
# vm.provider=vagrant          → Vagrant + VirtualBox local (dev)
# vm.provider=direct-ssh       → SSH direct to existing VMs (prod, no VirtualBox)
# vm.provider=remote-vagrant   → Vagrant + VirtualBox on remote host via SSH
vm.provider=vagrant
vm.host.host=${VM_HOST_HOST:192.168.56.1}
vm.host.port=${VM_HOST_PORT:22}
vm.host.user=${VM_HOST_USER:mehdi}
vm.host.key-path=${VM_HOST_KEY_PATH:}

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:static/db/migration

# ── Vagrant ───────────────────────────────────────────────────────────────────
vagrant.base-dir=./vms

# ── Errors ───────────────────────────────────────────────────────────────────
server.error.include-stacktrace=never

# ── SpringDoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Prometheus ────────────────────────────────────────────────────────────────
# Dev (port-forward):  kubectl port-forward -n monitoring svc/prometheus-service 9090:9090
# Prod (in-cluster):  http://prometheus-service.monitoring.svc:9090
prometheus.url=${PROMETHEUS_URL:http://localhost:9090}

# ── Backup scheduler ─────────────────────────────────────────────────────────
backup.scheduler.cron=0 0 2 * * ?
backup.scheduler.retention-days=30

management.health.mail.enabled=false

# ── Auth service (for token resolution) ──────────────────────────────────────
auth.service.url=${AUTH_SERVICE_URL:http://localhost:7070}
