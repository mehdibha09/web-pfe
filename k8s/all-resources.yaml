apiVersion: v1
kind: Namespace
metadata:
  name: app-pfe

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-service-role
  namespace: app-pfe
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "events", "namespaces", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-service-binding
  namespace: app-pfe
subjects:
  - kind: ServiceAccount
    name: default
    namespace: app-pfe
roleRef:
  kind: Role
  name: deployment-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Postgres is deployed via postgres.yaml (in-cluster PVC-based)
# This EndpointSlice replaces it when using an external DB host
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-external
  namespace: app-pfe
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.56.40
ports:
  - name: postgres
    port: 5432
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app-pfe
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-service-cluster-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-service-cluster-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: app-pfe
roleRef:
  kind: ClusterRole
  name: deployment-service-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: app-pfe
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deployment_service
  SPRING_PROFILES_ACTIVE: prod
  AUTH_SERVER_PORT: '7070'
  GATEWAY_SERVER_PORT: '6060'
  CLOUD_PRICER_SERVER_PORT: '8090'
  DEPLOYMENT_SERVER_PORT: '8082'
  MAIL_HOST: smtp-relay.brevo.com
  MAIL_PORT: '587'
  MAIL_FROM: noreply@auth-service.local
  FRONTEND_BASE_URL: http://frontend
  MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
  ALERT_DISPATCH_ENABLED: 'false'
  VM_HOST_HOST: '192.168.56.1'
  VM_HOST_USER: 'mehdi'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: app-pfe
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '7070'
        prometheus.io/path: '/actuator/prometheus'
    spec:
      imagePullSecrets:
        - name: nexus-regcred
      containers:
        - name: auth-service
          image: 192.168.56.30/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7070
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: AUTH_SERVER_PORT
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MAIL_PORT
            - name: MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MAIL_FROM
            - name: FRONTEND_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: FRONTEND_BASE_URL
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MANAGEMENT_HEALTH_MAIL_ENABLED
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MAIL_PASSWORD
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 7070
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 7070
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: app-pfe
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - name: http
      port: 7070
      targetPort: 7070
      nodePort: 30707
