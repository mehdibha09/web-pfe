---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
  namespace: app-pfe

spec:
  replicas: 1
  revisionHistoryLimit: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: deployment-service

  template:
    metadata:
      labels:
        app: deployment-service

      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8082'
        prometheus.io/path: '/actuator/prometheus'

    spec:
      imagePullSecrets:
        - name: nexus-regcred
      containers:
        - name: deployment-service
          image: 192.168.56.30/deployment-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: DB_HOST
              value: postgres

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SPRING_DATASOURCE_PASSWORD

            - name: SECURITY_INTERNAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SECURITY_INTERNAL_SIGNING_SECRET

            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SPRING_PROFILES_ACTIVE

            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DEPLOYMENT_SERVER_PORT

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:7070"

            - name: VM_PROVIDER
              value: "remote-vagrant"

            - name: VM_HOST_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: VM_HOST_HOST

            - name: VM_HOST_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: VM_HOST_USER

            - name: VM_HOST_KEY_PATH
              value: "/etc/ssh-deploy/id_ed25519"

            - name: AGENT_BACKEND_URL
              value: "ws://deployment-service:8082"

            - name: PROMETHEUS_URL
              value: "http://prometheus-service.monitoring.svc:9090"

          volumeMounts:
            - name: deploy-ssh-key
              mountPath: /etc/ssh-deploy
              readOnly: true

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '1Gi'
              cpu: '1'

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: deploy-ssh-key
          secret:
            secretName: deploy-ssh-key
            defaultMode: 0600

---
apiVersion: v1
kind: Service

metadata:
  name: deployment-service
  namespace: app-pfe

spec:
  type: NodePort

  selector:
    app: deployment-service

  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30811
